name: Local Supabase stack
description: >
  Starts the project's own disposable Docker Supabase, replays every committed migration
  into it, and writes the browser-safe values the suites read. Used by the database and
  browser jobs so both qualify against the same thing. No hosted project, no access
  token, no service-role key: every value here is generated by the local stack.

inputs:
  reset:
    description: Replay all committed migrations from an empty database before handing the stack back
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Start the local Supabase stack
      shell: bash
      run: pnpm supabase:start

    - name: Write the browser-safe local configuration
      shell: bash
      run: node scripts/local-supabase-env.mjs

    # The suites assert against the schema the committed migrations produce, not whatever
    # a half-finished database happens to hold, so the stack is replayed from zero.
    - name: Replay every committed migration
      if: ${{ inputs.reset == 'true' }}
      shell: bash
      run: pnpm db:reset:local

    - name: Confirm the stack is the loopback stack this stage qualifies against
      shell: bash
      run: node scripts/local-stack-check.mjs
