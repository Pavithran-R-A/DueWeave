name: Local Supabase stack
description: >
  Starts the project's own disposable Docker Supabase, replays every committed migration
  into it, and writes the browser-safe values the suites read. Used by the database and
  browser jobs so both qualify against the same thing. No hosted project, no access
  token, no service-role key: every value here is generated by the local stack.

inputs:
  reset:
    description: Replay all committed migrations from an empty database before handing the stack back
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # On a persistent runner the stack from an earlier job (or from the developer's own
    # `pnpm supabase:start`, which shares this machine's Docker engine) would otherwise be
    # inherited, and a suite cannot tell a replayed schema from a half-replayed one. This
    # is keyed to this checkout's project id, so it stops DueWeave's stack and nothing
    # else on the host. Nothing running is not an error.
    - name: Release any DueWeave stack a previous job left running
      shell: bash
      run: pnpm supabase stop --no-backup >/dev/null 2>&1 || true

    # D-S9-7: the CLI prints the privileged key it just generated for this stack, and on a
    # persistent runner a step's stdout is the job log the platform retains — run
    # 36555102272's database and browser logs each carried one `sb_secret_…` value. The filter
    # masks credential-shaped output and keeps the URLs, ports and browser-safe keys an operator
    # needs to see why a stack did not start. `pipefail` is load-bearing: `bash -e` alone reads
    # the filter's exit code, so a stack that failed to start would still mark the step green.
    - name: Start the local Supabase stack
      shell: bash
      run: |
        set -o pipefail
        pnpm supabase:start 2>&1 | node scripts/redact-cli-secrets.mjs

    - name: Write the browser-safe local configuration
      shell: bash
      run: node scripts/local-supabase-env.mjs

    # D-S9-14: the replay is a second writer on the database it is recreating. `Start the local
    # Supabase stack` above leaves this project's realtime container live, the replay's
    # `Recreating database` drops its database, and the reconnecting container runs its own Ecto
    # migration pass at the same moment as the replay's transient container. Both insert the same
    # version into `_realtime.schema_migrations`; run 34's loser reported
    # `** (Ecto.ConstraintError) ... * "schema_migrations_pkey" (unique_constraint)` and
    # `error running container: exit 1`. Measured in that order, the live container completed a
    # 33-migration pass inside one replay window, serialised with the other writer by 7.4 s of
    # timing luck. Forced simultaneous passes reproduce run 34's error; sequential ones both pass.
    # So the live writer is removed from the window instead of outrun. Gated on the same input as
    # the replay: a caller that asks for no replay does not have its stack touched.
    - name: Pause this checkout's realtime container for the replay
      if: ${{ inputs.reset == 'true' }}
      shell: bash
      run: node scripts/local-realtime-pause.mjs stop

    # The suites assert against the schema the committed migrations produce, not whatever
    # a half-finished database happens to hold, so the stack is replayed from zero.
    # D-S9-10: runs 23 and 24 both died inside this replay with only `error running
    # container: exit 1` retained, followed by the CLI's own instruction — "Try rerunning
    # the command with --debug to troubleshoot the error." The one-shot container's trace
    # exists only under `--debug`, so a red run left no cause in any artefact. `--debug` is
    # pnpm-forwarded to the same `supabase db reset --local --yes` (proved against the
    # pinned CLI), so the gate is the command it was always meant to be; the pipe keeps
    # D-S9-7's masking in front of the platform's log, and `pipefail` keeps a failed replay
    # red.
    - name: Replay every committed migration
      if: ${{ inputs.reset == 'true' }}
      shell: bash
      run: |
        set -o pipefail
        pnpm db:reset:local --debug 2>&1 | node scripts/redact-cli-secrets.mjs

    # Realtime stays part of the qualified stack: the auth sessions ride `/realtime/v1`, so the
    # pause lasts exactly as long as the replay. `db reset` normally boots this container again in
    # its own "Restarting containers" phase, where its migration pass finds the ledger already
    # complete; this step is what makes the restoration an assertion rather than a hope.
    - name: Restore the realtime container the replay paused
      if: ${{ inputs.reset == 'true' }}
      shell: bash
      run: node scripts/local-realtime-pause.mjs start

    - name: Confirm the stack is the loopback stack this stage qualifies against
      shell: bash
      run: node scripts/local-stack-check.mjs
