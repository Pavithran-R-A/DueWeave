name: CI

# PHASE 2: the previous file triggered on `main` and two Stage 4 branches that were
# deleted months ago, so the delivered Stage 8 commit had no run at all and `pnpm test`
# inside CI silently skipped every database-backed suite. These triggers name the
# branches this roadmap actually uses, and the jobs below run the suites that cannot
# skip without an environment. `release/consumer-live` joins the push list because the
# consumer-live release line has to carry CI evidence for its own head: measured on
# 2026-10-04, pushing it produced `total_count: 0` runs, which left only its parent
# head's green run available to be mistaken for its own.
on:
  pull_request:
  push:
    branches: [main, current-stage-9-security-ci, release/consumer-live]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# RUNNER POLICY — consumer-live now uses fresh GitHub-hosted Linux runners.
#
# This repository is public, so standard GitHub-hosted runners are free and unlimited.
# Each job gets a clean VM with its own Docker daemon instead of depending on the developer
# laptop's shared Docker Desktop/WSL2 state. That removes the Phase 3C environment blocker where
# Docker CLI calls wedged while already-running containers still answered HTTP.
#
# The same repository-local Supabase actions remain authoritative: they start a disposable local
# stack, replay every committed migration, run the database/live/browser gates, and tear the stack
# down. No hosted-production credential is provided to CI.
jobs:
  static:
    name: Static verification
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-toolchain

      # Before the tests: three contracts inspect the built bundle, and without a build
      # they report "skipped" while the job still goes green.
      - name: Build the production bundle
        run: pnpm build

      - name: Unit and boundary contracts (no database)
        run: pnpm test:unit

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm check

      - name: Secret and privileged-credential scan (source and bundle)
        run: pnpm verify:secrets

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      # PHASE 9: recorded, not accepted silently. The development tree currently carries
      # advisories (measured at Stage 9: 38 findings, 2 critical, in vitest/tar/vite
      # tooling). None of them ship in the browser bundle, and none are reachable from a
      # `vitest run`/`vite build` that never starts the Vitest UI server or a dev server.
      # Upgrading the toolchain is a dependency decision this stage does not make, so the
      # step prints the state of the tree on every run instead of pretending it is clean.
      - name: Development toolchain audit (recorded, not blocking)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  database:
    name: Database contracts
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/local-supabase

      - name: Generated types match the replayed schema
        run: pnpm verify:types

      - name: Committed migrations match the applied set
        run: pnpm verify:migrations

      - name: pgTAP suites inside the local database
        run: pnpm test:db

      # PHASE 22: the schema linter is blocking. A lint finding is a defect the next
      # migration inherits, and a non-blocking lint step is a step nobody reads.
      - name: Schema lint
        run: pnpm db:lint

      # Arc 3C row U (`docs/RELEASE_GATE_MATRIX.md`): the erasure battery in `tests/arc3c-local-account-erasure.test.ts`
      # calls `delete-account` over HTTP, so `pnpm test:live` needs this checkout's Edge Function
      # served as well as its schema replayed. Until now the workflow had no such step, which is why
      # the row could never be executed by a run. The script owns the watcher's lifecycle because
      # `supabase functions serve` is a foreground process — a plain `run:` step would never finish —
      # and it decides readiness from the endpoint's own answer rather than from a sleep: 404 means
      # the function is not mounted, 501 means `ALLOWED_APP_ORIGIN` never reached the container, and
      # only 401-for-a-caller-with-no-token means served-and-configured. Readiness polls every 500 ms
      # against a 90 s ceiling (both constants live in the script), and a missed ceiling is reported as
      # a blocked gate rather than a pass. No workflow has executed this step yet, so the step is
      # written-and-dry-run-verified only; locally, a serve whose watcher was running against the
      # Windows path never reached served-and-configured at all and the battery answered 502 — the
      # churn and its counts are recorded in `docs/CONSUMER_LIVE_PROGRESS.md` and
      # `docs/RELEASE_GATE_MATRIX.md` note 8, which is why readiness is read from the endpoint and not
      # from a sleep.
      - name: Serve the delete-account Edge Function for the erasure battery
        run: node scripts/local-functions-serve.mjs start

      - name: Database-backed contract suites
        run: pnpm test:live

      # `if: always()`, and scoped: the script terminates only the pid this checkout recorded and
      # stops only `supabase_edge_runtime_<this project id>`, so the release does not reach the other
      # stack on this host. It then proves the endpoint stopped answering. `release-local-ci-state`
      # still stops the whole stack afterwards; this step is what keeps the watcher itself from
      # outliving the job.
      - name: Release the served Edge Function
        if: ${{ always() }}
        run: node scripts/local-functions-serve.mjs stop

      - uses: ./.github/actions/release-local-ci-state
        if: ${{ always() }}

  browser:
    name: Browser release smoke
    runs-on: ubuntu-24.04
    needs: [static, database]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-toolchain
      # The order is load-bearing: the stack action generates .env.local, and the build
      # inlines those values into the bundle the journeys then drive.
      - uses: ./.github/actions/local-supabase

      # A persistent host has no fresh filesystem between runs, so the state a cancelled
      # or failed job leaves behind has to be cleared explicitly. Scoped to DueWeave and
      # to this checkout: only processes whose working directory is inside this workspace
      # are touched, and only this checkout's two preview ports. Never a global `docker
      # system prune` — this machine runs other projects' containers too.
      - name: Clear servers and reports a previous DueWeave job left behind
        shell: bash
        run: |
          for port in 3000 3100; do
            for pid in $(ss -Htlnp "sport = :$port" 2>/dev/null | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u); do
              cwd=$(readlink "/proc/$pid/cwd" 2>/dev/null || true)
              if [ -n "$cwd" ] && [ "$cwd" = "$GITHUB_WORKSPACE" ]; then
                echo "Stopping DueWeave server left on port $port (pid $pid)"
                kill "$pid"
              fi
            done
          done
          rm -rf test-results playwright-report

      # A GitHub-hosted Ubuntu runner is ephemeral and supports the package installation
      # Playwright needs, so install Chromium and its OS dependencies together. A missing
      # browser or library therefore fails this job instead of depending on laptop state.
      - name: Install the Chromium build the suite launches
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the bundle the suite drives
        run: pnpm build

      # PHASE 17: CI runs the release-critical journeys — the Stage 9 fresh-account and
      # cross-account journeys, the Stage 7 export and follow-up flows, the Stage 8
      # customer and reviewer flows, and the accessibility qualification. The full
      # responsive and interaction battery stays the canonical local command
      # (`pnpm verify:e2e:local`), and the list lives in package.json so CI and a laptop
      # cannot drift into claiming different coverage.
      - name: Release journeys
        run: pnpm test:e2e:smoke

      # PHASE 16's rule — a release journey that logs a console error, an uncaught error,
      # an unanswered request or a React warning is a failed journey — is enforced by the
      # problem watcher inside each suite, so a red run here is a defect, not a flake. The
      # smoke journeys above watch the production bundle, which carries the minified React
      # build and therefore cannot emit a warning at all; the warning channel is only
      # observable against `vite dev`, which is the second config this step runs. Without
      # it CI would claim PHASE 16 coverage it never measured: the gate existed only on a
      # laptop. Retries are 0 in both configs, so a failure is reported once and honestly.
      # Measured locally against the same local stack: 3 passed (1.9m).
      - name: React warning and console discipline
        run: pnpm test:e2e:react-warnings

      # PHASE 23: artefacts are what makes a CI red run diagnosable without re-running
      # it. They are scanned before upload, because a failure screenshot or trace can
      # carry whatever was on screen; the upload never includes .env.local, the built
      # bundle (which inlines the local stack's configuration) or any database dump.
      # D-S9-15: the step is `always()` because a failed journey is exactly the run whose
      # artefacts need reading, which also means it runs when the job died before Playwright
      # and produced nothing. Run 34's browser job then showed a Node ENOENT stack trace out of
      # the credential scanner as a second red step, in front of the real failure and reading
      # like a found credential. The existence test asks the question the crash answered by
      # exploding — was there an artefact? — and says which answer it took. The scanner keeps
      # refusing a directory that is not there when it is named directly (see PHASE 23's
      # oracle in ci-gate-manifest): tolerating absence here is a statement about this job's
      # order, not a general weakening of the gate.
      - name: Scan artefacts before uploading them
        if: ${{ always() }}
        run: |
          if [ -d test-results ]; then
            node scripts/verify-secrets.mjs --dir test-results
          else
            echo "no test-results directory: the journey steps produced no artefact to scan"
          fi
          if [ -d playwright-report ]; then
            node scripts/verify-secrets.mjs --dir playwright-report
          else
            echo "no playwright-report directory: the journey steps produced no artefact to scan"
          fi

      # The stack and the bundle belong to this job, not to the host: leaving them running
      # would make the next run inherit them, and would hold the loopback ports the
      # developer's own `pnpm supabase:start` needs.
      - uses: ./.github/actions/release-local-ci-state
        if: ${{ always() }}

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke-failure-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
