name: Live production public smoke

# This suite checks the public Pages hostname on release pushes. Deployment may lag CI; the
# Cloudflare deployment SHA must be verified separately before certifying an exact-head release:
# `pnpm verify:deployed:current --sha <commit>` reads the deployment's own `build-info.json` and
# fails closed until the site can name the commit it serves. Stability is not currency.
on:
  push:
    branches: [release/consumer-live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-public:
    runs-on: ubuntu-24.04
    # The suite spends most of this waiting, on purpose: `playwright.live-public.config.ts` gives
    # the site up to 15 minutes to stop being rebuilt before the first assertion runs, because
    # measuring production on 2026-10-13 found a push taking 17 minutes to serve a byte-identical
    # stylesheet. A rebuild that outlasts the wait fails with both builds' fingerprints rather
    # than testing whichever artifact happened to be answering.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-toolchain
      - name: Install real Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test production browser and public routes
        run: pnpm exec playwright test --config=playwright.live-public.config.ts
