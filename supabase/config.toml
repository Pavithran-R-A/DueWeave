# Local development configuration only.
#
# `project_id` names the local Docker stack created by `supabase start`. It is not
# a hosted project reference. The repository has since been linked to one for the
# Phase 3 production work (`supabase link` + `db push` of the committed migration
# chain, both recorded in docs/CONSUMER_LIVE_PROGRESS.md), so this file governs the
# local stack while the linked reference in the gitignored `supabase/.temp/` decides
# where `--linked` commands go. Nothing here changes hosted configuration on its own.
project_id = "dueweave"

[api]
enabled = true
schemas = ["public"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3000",
  "http://127.0.0.1:3000/auth/update-password",
  "http://localhost:3000/auth/update-password",
]
enable_signup = true

# LOCAL ONLY: signup and recovery mail is captured by the stack's bundled mail
# catcher, so an automated browser journey can complete without external SMTP.
# This is not a production email-confirmation policy decision.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# The account-deletion endpoint (Arc 3C STEP 4). Pinned explicitly rather than left to the
# platform default: the gateway must verify the caller's JWT before the handler runs, on top of the
# handler's own `getUser()` check, so a deployment that forgets this setting is a visible diff rather
# than a silent widening of a destructive route. Secrets for it are never in this file — see
# supabase/functions/.env.example and docs/ACCOUNT_ERASURE_DESIGN.md.
[functions."delete-account"]
verify_jwt = true
